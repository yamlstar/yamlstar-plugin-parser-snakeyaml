name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
    - run: |
        make check-versions test test-build-order test-goyaml-race \
          test-release shellcheck

  java-11:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 11
    - run: mvn --batch-mode --no-transfer-progress test
