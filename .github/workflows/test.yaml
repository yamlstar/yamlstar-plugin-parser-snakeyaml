name: Test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Reviewed source commit
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref || github.sha }}
    - run: |
        make check-versions test test-build-order test-goyaml-race \
          test-release shellcheck

  java-11:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ inputs.ref || github.sha }}
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 11
    - run: mvn --batch-mode --no-transfer-progress test
