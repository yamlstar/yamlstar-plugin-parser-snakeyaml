name: Native archives
run-name: Native ${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed version to build
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-22.04
          platform: linux-x64
        - runner: ubuntu-22.04-arm
          platform: linux-aarch64
        - runner: macos-15
          platform: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v5
      with:
        ref: ${{ github.sha }}
    - name: Check reviewed version
      run: |
        [[ $RELEASE_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        make check-versions VERSION="$RELEASE_VERSION"
        echo "Release $RELEASE_VERSION from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
    - name: Test and package
      run: make dist test-goyaml-race test-graal-host
    - uses: actions/upload-artifact@v6
      with:
        name: native-${{ matrix.platform }}
        path: dist/*.tar.xz
        retention-days: 14

  checksums:
    needs: build
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/download-artifact@v7
      with:
        pattern: native-*
        merge-multiple: true
        path: dist
    - name: Combine checksums
      run: |
        cd dist
        archives=(*.tar.xz)
        test "${#archives[@]}" = 3
        for platform in linux-x64 linux-aarch64 macos-arm64; do
          test -f "yamlstar-plugin-parser-snakeyaml-$RELEASE_VERSION-$platform.tar.xz"
        done
        sha256sum "${archives[@]}" > SHA256SUMS
    - uses: actions/upload-artifact@v6
      with:
        name: native-release
        path: dist/*
        retention-days: 14
